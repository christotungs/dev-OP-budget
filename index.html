<title>Budget-Contrôle OP ISTM/Kin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: registre administratif — bandeau d'en-tête, onglets, contenu en grille; la fiche Budget-Contrôle reprend la case de l'OP papier. */
:root{
  --paper:#f6f8fb; --sheet:#ffffff; --ink:#15233a; --muted:#5b6b82; --line:#d5dde8; --line-strong:#1a2b45;
  --accent:#1f5fa8; --accent-soft:#e3edf9; --band:#0f2a4d; --band-fg:#f2f6fb;
  --ok:#1d7a4a; --ok-soft:#e2f3ea; --warn:#a86512; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Public Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1522; --sheet:#151f30; --ink:#e4ebf5; --muted:#93a3bb; --line:#2a3850; --line-strong:#9fb3cf;
  --accent:#7fb0ec; --accent-soft:#1c2d47; --band:#0a1424; --band-fg:#e4ebf5;
  --ok:#5fcf95; --ok-soft:#14301f; --warn:#e9a650; --warn-soft:#352612; --bad:#f08a82; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1522; --sheet:#151f30; --ink:#e4ebf5; --muted:#93a3bb; --line:#2a3850; --line-strong:#9fb3cf;
  --accent:#7fb0ec; --accent-soft:#1c2d47; --band:#0a1424; --band-fg:#e4ebf5;
  --ok:#5fcf95; --ok-soft:#14301f; --warn:#e9a650; --warn-soft:#352612; --bad:#f08a82; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--band);color:var(--band-fg)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-soft)} .chip.warn{color:var(--warn);background:var(--warn-soft)} .chip.bad{color:var(--bad);background:var(--bad-soft)}
.chip.plain{color:var(--band-fg);border-color:rgba(255,255,255,.35)}
nav.tabs{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800} h2{font-size:17px;font-weight:700} h3{font-size:14px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 160px;min-width:0}
.stack>.field{flex:none}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input.num{font-family:var(--f-num);text-align:right}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:4px;padding:8px 14px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.notice{border-radius:4px;padding:10px 12px;font-size:13px;border:1px solid}
.notice.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.notice.info{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-num);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.kpi small{color:var(--muted)}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--paper);position:sticky;top:0;font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tr.grp td{background:var(--accent-soft);font-weight:700;font-family:var(--f-display)}
tr.tot td{font-weight:700;border-top:2px solid var(--line-strong)}
tr.annule td{color:var(--muted);text-decoration:line-through}
tr.depasse td.dispo{color:var(--bad);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hot{background:var(--warn)} .bar i.over{background:var(--bad)}
/* Fiche Budget-Contrôle (reprise de l'OP papier) */
.bc{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px 22px;position:relative;overflow:hidden}
.bc::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 85% 40%,transparent 0 10px,var(--accent-soft) 10px 11px);opacity:.55;pointer-events:none}
.bc>*{position:relative}
.bc .rule{border-top:3px solid var(--line-strong);margin-bottom:3px} .bc .rule2{border-top:1px solid var(--line-strong)}
.bc h2{font-size:21px;font-weight:800;letter-spacing:.02em;margin:10px 0 8px}
.bc h3{font-size:16px;margin:14px 0 12px}
.bcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:14px}
.bcgrid .lb{font-family:var(--f-display);font-weight:700;font-size:15px;padding:8px 0;display:flex;align-items:center;min-height:42px}
.bcgrid .val{border:2px solid var(--line-strong);border-top-width:0;padding:8px 12px;font-family:var(--f-num);font-size:15px;font-weight:600;text-align:right;display:flex;align-items:center;justify-content:flex-end;min-height:42px;background:color-mix(in srgb,var(--sheet) 85%,transparent);overflow-wrap:anywhere}
.bcgrid .val.first{border-top-width:2px;justify-content:flex-start;text-align:left;font-size:13px}
.bcgrid .val.over{color:var(--bad)} .bcgrid .val.okv{color:var(--ok)}
.ophead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;font-family:var(--f-display);font-size:12px}
.ophead .big{font-size:15px}.ophead .istm{letter-spacing:.2em;color:var(--muted);font-weight:700}
.optitle{text-align:center;font-size:19px!important;margin:12px 0 6px!important}
.opsomme{margin:8px 0}
.opdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin:10px 0 0}.opdl dt{font-family:var(--f-display);font-weight:700}.opdl dd{margin:0;border-bottom:1px dotted var(--line-strong);overflow-wrap:anywhere}
.brand-row{display:flex;gap:12px;align-items:center;min-width:0}.blason{border-radius:50%;background:#fff;flex:none}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--sheet);font-size:11px;text-align:center}
.neg{color:var(--bad)} .cle{color:var(--accent);font-size:12px}
label.hb{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:4px;font-size:13px}label.hb input{width:auto;margin-top:2px}
.hbline{text-align:center;color:var(--bad);font-weight:700;font-size:12px;margin:0 0 6px}
.hbcard{border-color:var(--warn)}
.ophead{display:grid!important;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}.ophead>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}.ophead img{border-radius:50%;background:#fff}
.signs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;font-size:11px;font-weight:600;text-align:center}.signs span{border-top:1px solid var(--line-strong);padding-top:40px;order:0}
@media (max-width:520px){.signs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bcfoot{margin-top:18px;border-top:1px solid var(--line-strong);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-family:var(--f-display);font-weight:700}
.bcfoot .dots{font-weight:500}
/* imputation picker */
.pick{display:flex;flex-direction:column;gap:6px}
.pick select{height:160px;font-size:13px}
/* répartition */
details.rub{border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
details.rub>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:10px 14px}
details.rub>summary::-webkit-details-marker{display:none}
details.rub>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.rub[open]>summary{border-bottom:1px solid var(--line)}
@media (max-width:700px){details.rub>summary{grid-template-columns:minmax(0,1fr)}}
.rubname{font-family:var(--f-display);font-weight:700}
.rubbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rubbody td input{padding:5px 7px;font-size:13px}
.rubbody td select{padding:5px 4px;font-size:12px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-fg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--bad);border-radius:4px;background:var(--bad-soft)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const sp = s => s.replace(/ | /g," ");
const fc = v => sp(nf.format(Math.round(v||0))) + " FC";
const fmtDev = (v,d) => d && d!=="CDF" ? sp(nf2.format(v||0))+" "+d : fc(v);
const pct = v => (isFinite(v)? (v*100).toFixed(1).replace(".",",") : "0,0") + " %";
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fdate = d => d ? d.split("-").reverse().join("/") : "";
const parseNum = s => { if (typeof s === "number") return s; const v = parseFloat(String(s||"").replace(/\s| | /g,"").replace(",", ".")); return isFinite(v)? v : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const nospace = s => String(s||"").replace(/\s+/g,"").toLowerCase();
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,3600); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- calculs budgétaires ---------- */
function params(){ return (S.draft||S.rep)?.params || SEED.repartition.params; }
function taux(){ return {USD:2800, EUR:3000, ...(S.taux||{})}; }
const versCDF = (m,d,t) => d==="USD"? m*(t||taux().USD) : d==="EUR"? m*(t||taux().EUR) : m;
function effVal(l,p){ p=p||params(); if(!l.eff) return parseNum(l.effectif);
  const R=+p.REC||0,M=+p.MON||0,A=+p.MAS||0; return ({REC:R,MON:M,MAS:A,RM:R+M,TOT:R+M+A})[l.eff] ?? parseNum(l.effectif); }
function ligneMontant(l,p){ p=p||params(); return effVal(l,p) * parseNum(l.taux) * (l.usd ? parseNum(p.tauxChange) : parseNum(l.base)); }
function rubTotal(r,p){ return (r.lignes||[]).reduce((s,l)=>s+ligneMontant(l,p),0); }
function comptesDe(rep){ return (rep||S.draft||S.rep)?.comptes || SEED.repartition.comptes; }
const compteMontant = c => (c.postes&&c.postes.length) ? c.postes.reduce((s,p)=>s+parseNum(p.montant),0) : parseNum(c.montant);
function imps(){ return S.plan?.imputations || []; }
function rubsDe(impId){ return impId? ((S.rep||SEED.repartition).rubriques||[]).filter(r=>r.imputation===impId) : []; }
function impById(id){ return imps().find(i=>i.id===id); }
function creditsPrevus(rep){ rep=rep||S.draft||S.rep; const c={}; const p=rep?.params;
  for(const i of imps()) c[i.id]=parseNum(i.direct);
  for(const r of rep?.rubriques||[]) if(r.imputation && c[r.imputation]!==undefined) c[r.imputation]+=rubTotal(r,p);
  return c; }
const vote = () => S.vote && S.vote.statut==="vote" ? S.vote : null;
/* Imputation qui porte le crédit : la ligne elle-même si elle a un crédit voté, sinon la ligne mère la plus proche (64 55 01 -> 64 55) */
let _ctrl={k:null,m:new Map()};
function ctrlId(id){ const v=vote(); if(!v||!id) return id; const key=v.version+":"+v.date; if(_ctrl.k!==key||_ctrl.n!==imps().length){ _ctrl={k:key,n:imps().length,m:new Map()}; }
  if(_ctrl.m.has(id)) return _ctrl.m.get(id); let res=id;
  if(!(v.credits[id]>0)){ const i=impById(id); if(i){ const c=nospace(i.code); let best=null, bl=0;
    for(const j of imps()){ const cj=nospace(j.code); if(j.id!==id && cj.length<c.length && cj.length>bl && c.startsWith(cj) && v.credits[j.id]>0){ best=j; bl=cj.length; } } if(best) res=best.id; } }
  _ctrl.m.set(id,res); return res; }
function creditInitial(id){ const v=vote(); return v ? (v.credits?.[id]||0) : 0; }
function compteVote(id){ const v=vote(); if(v?.comptes && v.comptes[id]!==undefined) return v.comptes[id]; const c=comptesDe(S.rep).find(x=>x.id===id); return c? compteMontant(c):0; }
function compteNom(id){ return comptesDe(S.rep).find(c=>c.id===id)?.nom || "—"; }
function opsExercice(){ const ex=vote()?.exercice; return S.ops.filter(o=>!ex || !o.exercice || o.exercice===ex); }
const valStatut = o => o.validation?.statut || "En attente";
/* Une OP consomme le crédit sauf si elle est annulée, rejetée ou hors budget voté */
const compte_dans_budget = o => o.statut!=="annule" && valStatut(o)!=="Rejetée" && !o.horsBudget;
const cdf = o => o.montantCDF ?? parseNum(o.montant);
function seqOf(o){ const m=/^OP-(\d+)\//.exec(o.numero||""); return m? +m[1] : (parseFloat(o.numero)||0); }
function cmpOp(a,b){ return (a.date||"").localeCompare(b.date||"") || seqOf(a)-seqOf(b) || (a.createdAt||"").localeCompare(b.createdAt||""); }
function controle(){ const cum={}, cumC={}, out=new Map(); const list=[...opsExercice()].sort(cmpOp);
  for(const o of list){ const k=ctrlId(o.impId); const ci=creditInitial(k); const ant=cum[k]||0;
    if(!compte_dans_budget(o)){ out.set(o.id,{ci,eng:cdf(o),solde:ci-ant,cumul:ant,dispo:ci-ant,horsCalcul:true,ctrl:k}); continue; }
    const c=ant+cdf(o); cum[k]=c; if(o.compte) cumC[o.compte]=(cumC[o.compte]||0)+cdf(o);
    out.set(o.id,{ci,eng:cdf(o),solde:ci-ant,cumul:c,dispo:ci-c,ctrl:k}); }
  return {par:out, cum, cumC, list}; }

/* ---------- numérotation OP-001/MM/AAAA (jamais réutilisée) ---------- */
function cleMois(date){ const [y,m]=(date||today()).split("-"); return {cle:`OP-${m}-${y}`, m, y}; }
function maxSeqMois(date){ const {m,y}=cleMois(date); let mx=S.compteurs[`OP-${m}-${y}`]||0;
  for(const o of S.ops){ const r=/^OP-(\d+)\/(\d{2})\/(\d{4})$/.exec(o.numero||""); if(r && r[2]===m && r[3]===y) mx=Math.max(mx,+r[1]); } return mx; }
const fmtNum = (seq,date) => { const {m,y}=cleMois(date); return `OP-${String(seq).padStart(3,"0")}/${m}/${y}`; };
async function reserverNumero(date){ const {cle}=cleMois(date);
  if(S.mode!=="shared"){ const seq=maxSeqMois(date)+1; S.compteurs[cle]=seq; return {seq,numero:fmtNum(seq,date)}; }
  const ref=S.db.doc("compteurs/"+cle);
  for(let k=0;k<6;k++){ const r=await ref.acquire({holder:S.uid||("p-"+uid()),ttlMs:5000});
    if(r.acquired){ const s=await ref.get(); const seq=Math.max(s.exists? (s.data().seq||0):0, maxSeqMois(date))+1; await ref.set({seq}); S.compteurs[cle]=seq; return {seq,numero:fmtNum(seq,date)}; }
    await new Promise(res=>setTimeout(res,400+Math.random()*500)); }
  throw {code:"unavailable"}; }

/* ---------- stockage : base partagée (claude.ai) ou navigateur ---------- */
const LKEY="bcop-istm-v1";
function localLoad(){ try{ return JSON.parse(localStorage.getItem(LKEY)||"null"); }catch{ return null; } }
function localSave(){ try{ localStorage.setItem(LKEY, JSON.stringify({plan:S.plan,rep:S.rep,vote:S.vote,taux:S.taux,ops:S.ops,compteurs:S.compteurs})); }catch{ toast("Enregistrement local impossible dans ce navigateur."); } }
async function writeDoc(path,data){ if(S.mode==="shared"){ await S.db.doc(path).set(data); } else { applyLocal(path,data); localSave(); render(); } }
function applyLocal(path,data){ if(path==="budget/plan") S.plan=data; else if(path==="budget/repartition") S.rep=data; else if(path==="budget/vote") S.vote=data; else if(path==="budget/taux") S.taux=data;
  else if(path.startsWith("ops/")){ const id=path.slice(4); const k=S.ops.findIndex(o=>o.id===id); const d={...data,id}; if(k>=0) S.ops[k]=d; else S.ops.push(d); } }
async function saveOp(op){ const {id,...body}=op; await writeDoc("ops/"+id, body); }
function dbError(e){ const c=e?.code; if(c==="invalid_argument") return "Accès refusé : votre niveau de partage ne permet pas cette opération (Contributeur pour saisir les OP, Éditeur pour le budget et la validation).";
  if(c==="quota_exceeded") return "Capacité de stockage atteinte : "+(e.message||""); return "Enregistrement impossible pour le moment ("+(c||"erreur")+"). Réessayez."; }

async function boot(){
  let db=null,user=null,dl=null;
  if(window.claude?.use){ try{ [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]); }catch{} }
  S.dl=dl; S.user=user;
  if(db){ S.mode="shared"; S.db=db;
    S.admin = user ? !!(await user.canEdit()) : false;
    try{ S.uid = user ? await user.id() : null; S.me = user ? await user.me() : null; }catch{}
    const timer=setTimeout(()=>{ if(!S.loaded.plan){ S.msg="Les données partagées ne répondent pas encore ; affichage possiblement incomplet."; render(); } },10000);
    const sub=(path,key)=>db.doc(path).onSnapshot(s=>{ S[key]=s.exists? s.data(): null; S.loaded[key]=true; if(!s.metadata.fromCache) clearTimeout(timer); render(); }, e=>{ S.loaded[key]=true; S.msg=dbError(e); render(); });
    sub("budget/plan","plan"); sub("budget/repartition","rep"); sub("budget/vote","vote"); sub("budget/taux","taux");
    db.collection("ops").onSnapshot(q=>{ S.ops=q.docs.map(d=>({...d.data(),id:d.id})); S.loaded.ops=true; resolveNames(); render(); }, e=>{ S.loaded.ops=true; S.msg=dbError(e); render(); });
    db.collection("compteurs").onSnapshot(q=>{ const c={}; q.docs.forEach(d=>c[d.id]=d.data().seq||0); S.compteurs=c; render(); }, ()=>{});
  } else {
    S.mode="local"; S.admin=true; const d=localLoad();
    if(d){ S.plan=d.plan; S.rep=d.rep; S.vote=d.vote; S.taux=d.taux||null; S.ops=d.ops||[]; S.compteurs=d.compteurs||{}; }
    S.loaded={plan:true,rep:true,vote:true,ops:true}; render();
  }
}
async function resolveNames(){ if(!S.user) return; const ids=[...new Set(S.ops.flatMap(o=>[o.auteur,o.validation?.par]).filter(Boolean))].filter(i=>!(i in S.names)); if(!ids.length) return;
  try{ const ps=await S.user.profiles(ids); let ch=false; for(const id of ids){ const n=ps?.[id]?.name||""; if(S.names[id]!==n){ S.names[id]=n; ch=true; } } if(ch) render(); }catch{} }
const nom = id => !id ? "—" : id===S.uid ? "vous" : (S.names[id] || "un collègue");

/* ---------- fichiers : téléchargement ---------- */
async function saveFile(filename, data){
  if(S.dl){ try{ await S.dl.save({filename,data}); toast("Fichier prêt : "+filename); }catch(e){ if(e?.code!=="declined") toast("Téléchargement impossible ("+(e?.code||"erreur")+")."); } return; }
  try{ const blob = data instanceof Blob ? data : new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
  catch{ toast("Téléchargement non disponible ici."); }
}

/* ---------- montant en lettres ---------- */
function enLettres(n){ const ent=Math.floor(n), dec=Math.round((n-ent)*100);
  const U=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const D=["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  const c99=x=>{ if(x<20) return U[x]; const d=Math.floor(x/10),u=x%10; let b=D[d];
    if(d===7||d===9){ const r=x-d*10+10; return b+(r===11&&d===7?"-et-":"-")+U[r]; }
    if(u===0) return d===8? b+"s": b; return b+(u===1&&d!==8?"-et-":"-")+U[u]; };
  const c999=x=>{ const h=Math.floor(x/100),r=x%100; let s=""; if(h){ s=(h>1?U[h]+"-":"")+"cent"+(h>1&&r===0?"s":""); } if(r) s+=(s?"-":"")+c99(r); return s; };
  const mots=x=>{ if(x===0) return "zéro"; let s=[]; for(const [v,w] of [[1e9,"milliard"],[1e6,"million"],[1e3,"mille"]]){ const q=Math.floor(x/v); x%=v; if(!q) continue;
    if(w==="mille") s.push(q===1?"mille":c999(q)+"-mille"); else s.push(c999(q)+"-"+w+(q>1?"s":"")); } if(x) s.push(c999(x)); return s.join("-"); };
  return mots(ent)+(dec? " virgule "+mots(dec):""); }
const sommeLettres = (m,d) => enLettres(m)+" "+(DEVISES[d||"CDF"]);

/* ---------- rendu ---------- */
function route(){ const h=(location.hash||"").slice(1); return TABS.some(t=>t[0]===h)? h : "tableau"; }
window.addEventListener("hashchange", render);
function render(){
  const r=route(), v=vote();
  const nAtt=opsExercice().filter(o=>o.statut!=="annule"&&valStatut(o)==="En attente").length;
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<a href="#${k}" ${k===r?'aria-current="page"':""}>${l}${k==="validation"&&nAtt?` <span class="count">${nAtt}</span>`:""}</a>`).join("");
  const ex = v?.exercice || params().exercice;
  $("#meta").innerHTML = `<span class="chip plain">Exercice ${esc(ex)}</span>`
    + (v ? `<span class="chip ok">Budget voté · v${v.version}</span>` : `<span class="chip warn">Budget non voté</span>`)
    + `<span class="chip plain">1 $ = ${sp(nf.format(taux().USD))} FC</span>`
    + `<span class="chip plain">${S.mode==="shared"?(S.admin?"Administrateur du Budget":"Opérateur de saisie"):S.mode==="local"?"Données sur ce poste":"…"}</span>`;
  const view=$("#view"); const active=document.activeElement; const aid=active?.id; let sel=[null,null]; try{ sel=[active?.selectionStart,active?.selectionEnd]; }catch{}
  if(S.mode==="loading" || (S.mode==="shared" && !S.loaded.plan)) return;
  let html = S.msg ? `<div class="notice warn">${esc(S.msg)}</div>` : "";
  if(!S.plan) html += emptyView();
  else html += ({tableau:vTableau,saisie:vSaisie,registre:vRegistre,validation:vValidation,situation:vSituation,repartition:vRepartition,canevas:vCanevas})[r]();
  view.innerHTML = html;
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ if(sel[0]!=null) el.setSelectionRange(sel[0],sel[1]); }catch{} } }
}
function emptyView(){
  return `<div class="card empty"><h2>Aucun budget chargé</h2>
  <p class="muted" style="max-width:60ch">Chargez le canevas budgétaire complet (Vade-mecum ESU, édition juin 2026, classes 6 et 7), le modèle de répartition repris de la prévision 2023-2024 et les comptes budgétaires (Fonctionnement, Construction, Encadrement, Ministère). Vous pourrez ensuite ajuster, voter le budget et saisir les OP.</p>
  ${S.admin? `<button class="primary" data-act="seed">Charger le canevas et la répartition</button>` : `<p class="muted">Seul l'Administrateur du Budget peut initialiser le budget.</p>`}</div>`;
}
const badgeVal = o => { const s=o.statut==="annule"?"Annulée":valStatut(o); const k={"Validée":"ok","Rejetée":"bad","Annulée":"bad"}[s]||"warn"; return `<span class="chip ${k}">${s}</span>`; };

/* --- Tableau de bord --- */
function vTableau(){
  const v=vote();
  if(!v) return `<div><h1>Tableau de bord</h1><p class="sub">Exécution du budget à partir des OP enregistrées.</p></div>
    <div class="notice warn">Le budget de l'exercice ${esc(params().exercice)} n'est pas encore voté. Vérifiez la répartition, puis votez-le dans <a href="#repartition">Répartition & vote</a>. La saisie des OP s'ouvre après le vote.</div>
    ${kpis(creditsTotal(creditsPrevus()),0,0,0,"Crédits prévus (répartition)")}`;
  const ctl=controle(); const cum=ctl.cum; const tot=creditsTotal(v.credits); const eng=Object.values(cum).reduce((a,b)=>a+b,0);
  const ops=opsExercice(); const nOp=ops.filter(compte_dans_budget).length; const nAtt=ops.filter(o=>o.statut!=="annule"&&valStatut(o)==="En attente").length;
  const hb=ops.filter(o=>o.horsBudget&&o.statut!=="annule"&&valStatut(o)!=="Rejetée").reduce((s,o)=>s+cdf(o),0);
  const rows=imps().map(i=>({i,ci:v.credits[i.id]||0,e:cum[i.id]||0})).filter(x=>x.ci||x.e);
  const over=rows.filter(x=>x.e>x.ci).sort((a,b)=>(b.e-b.ci)-(a.e-a.ci));
  const top=[...rows].filter(x=>x.e>0).sort((a,b)=>b.e-a.e).slice(0,8);
  const recent=[...ops].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,6);
  return `<div class="spread"><div><h1>Tableau de bord</h1><p class="sub">Budget voté le ${fdate(v.date)} · ${nOp} OP imputées au budget</p></div>
    <div class="btns"><a href="#saisie"><button class="primary">Nouvelle OP</button></a></div></div>
    ${kpis(tot,eng,nOp,nAtt)}
    ${over.length? `<div class="notice bad"><b>Dépassement budgétaire sur ${over.length} imputation(s) :</b> ${over.slice(0,6).map(x=>`${esc(x.i.code)} (${fc(x.e-x.ci)})`).join(" · ")}</div>`:`<div class="notice ok">Aucune imputation en dépassement.</div>`}
    ${hb?`<div class="notice warn"><b>Dépenses hors budget voté :</b> ${fc(hb)}, suivies à part sans toucher aux crédits. <a href="#situation">Voir le détail</a></div>`:""}
    ${comptesCartes(ctl)}
    <div class="grid2"><div class="card stack"><h2>Imputations les plus engagées</h2>
      ${top.length? `<div class="tbl"><table><thead><tr><th>Imputation</th><th class="r">Engagé</th><th>Taux</th></tr></thead><tbody>${top.map(rowBar).join("")}</tbody></table></div>`:`<p class="muted">Aucun engagement pour l'instant. Les imputations apparaîtront ici dès la première OP.</p>`}</div>
    <div class="card stack"><h2>Dernières OP saisies</h2>
      ${recent.length? `<div class="tbl"><table><thead><tr><th>N°</th><th>Bénéficiaire</th><th class="r">Montant</th></tr></thead><tbody>${recent.map(o=>`<tr class="${o.statut==="annule"?"annule":""}"><td class="n">${esc(o.numero)}<br>${badgeVal(o)}</td><td>${esc(o.beneficiaire)}<br><small class="muted">${esc(impById(o.impId)?.code||"")} · ${fdate(o.date)}</small></td><td class="r n">${fmtDev(o.montant,o.devise)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Aucune OP. Commencez par <a href="#saisie">la saisie</a>.</p>`}</div></div>`;
}
const creditsTotal = c => Object.values(c||{}).reduce((a,b)=>a+b,0);
function kpis(tot,eng,nOp,nAtt,lab){ const d=tot-eng; return `<div class="kpis">
  <div class="kpi"><span>${lab||"Crédits votés"}</span><b>${fc(tot)}</b></div>
  <div class="kpi"><span>Engagements cumulés</span><b>${fc(eng)}</b><small>${pct(tot?eng/tot:0)} du budget</small></div>
  <div class="kpi"><span>${d<0?"Dépassement global":"Disponible"}</span><b style="color:var(${d<0?"--bad":"--ok"})">${fc(Math.abs(d))}</b></div>
  <div class="kpi"><span>OP en attente de validation</span><b>${nAtt}</b><small>${nOp} OP imputées</small></div></div>`; }
function comptesCartes(ctl){ const cs=comptesDe(S.rep); return `<div class="kpis">${cs.map(c=>{ const m=compteVote(c.id), e=ctl.cumC[c.id]||0, s=m-e;
  return `<div class="kpi"><span>${esc(c.nom)}</span><b>${fc(m)}</b><small>Engagé ${fc(e)} · <span style="color:var(${s<0?"--bad":"--ok"})">${s<0?"Dépassement "+fc(-s):"Solde "+fc(s)}</span></small>${c.statut!=="aligne"?`<small>≈ ${fc(m/12)} / mois</small>`:`<small>Compte à part, source alignée</small>`}</div>`; }).join("")}</div>`; }
function rowBar(x){ const t=x.ci? x.e/x.ci : (x.e>0?2:0); return `<tr><td><b class="n">${esc(x.i.code)}</b> ${esc(x.i.libelle)}</td><td class="r n">${fc(x.e)}<br><small class="muted">sur ${fc(x.ci)}</small></td><td style="min-width:110px"><div class="bar"><i class="${t>1?"over":t>.85?"hot":""}" style="width:${Math.min(100,t*100)}%"></i></div><small class="n">${pct(t)}</small></td></tr>`; }

/* --- Saisie OP --- */
function blankForm(){ return {date:today(),service:"",compte:comptesDe(S.rep)[0]?.id||"",beneficiaire:"",adresse:"",objet:"",impId:"",montant:"",devise:"CDF",mode:"Espèces",statutPaiement:"En attente",observation:"",horsBudget:false,q:"",forcer:false}; }
function calcNouveau(f){ const k=ctrlId(f.impId); const ci=creditInitial(k); const cum=controle().cum[k]||0; const m=versCDF(parseNum(f.montant),f.devise);
  if(f.horsBudget) return {ci,eng:m,solde:ci-cum,cumul:cum,dispo:ci-cum,horsCalcul:true,ctrl:k};
  return {ci,eng:m,solde:ci-cum,cumul:cum+m,dispo:ci-cum-m,ctrl:k}; }
function servicesOptions(sel){ return `<option value="">— choisir —</option>`+SEED.services.map(g=>`<optgroup label="${esc(g.groupe)}">${g.items.map(i=>`<option ${i===sel?"selected":""}>${esc(i)}</option>`).join("")}</optgroup>`).join(""); }
function vSaisie(){
  const v=vote();
  if(!v) return `<h1>Nouvelle ordonnance de paiement</h1><div class="notice warn">La saisie s'ouvre après le vote du budget. Rendez-vous dans <a href="#repartition">Répartition & vote</a>.</div>`;
  if(!S.form) S.form=blankForm(); const f=S.form;
  const q=f.q.trim().toLowerCase(), qn=nospace(q); const cum=controle().cum;
  const list=imps().filter(i=>!q || nospace(i.code).includes(qn) || i.libelle.toLowerCase().includes(q));
  const opts=list.slice(0,400).map(i=>{ const k=ctrlId(i.id); const d=(v.credits[k]||0)-(cum[k]||0);
    return `<option value="${i.id}" ${i.id===f.impId?"selected":""}>${esc(i.code)} — ${esc(i.libelle)}  [dispo ${fc(d)}]</option>`; }).join("");
  const imp=impById(f.impId); const c=calcNouveau(f); const over=!f.horsBudget && c.dispo<0 && f.impId && c.eng>0;
  const numero=fmtNum(maxSeqMois(f.date)+1,f.date);
  const cpt=comptesDe(S.rep).find(x=>x.id===f.compte); const sC=cpt? compteVote(cpt.id)-(controle().cumC[cpt.id]||0)-(f.horsBudget?0:c.eng) : 0;
  const pret = imp && c.eng>0 && f.beneficiaire.trim() && f.compte && !(over&&(v.bloquer||!f.forcer));
  return `<div><h1>Nouvelle ordonnance de paiement</h1><p class="sub">L'opérateur remplit la partie gauche ; la copie de l'ordonnance et les renseignements budgétaires se remplissent automatiquement à droite.</p></div>

      <div class="field"><label for="f_compte">Compte budgétaire (source de financement)</label><select id="f_compte">${comptesDe(S.rep).map(x=>`<option value="${x.id}" ${x.id===f.compte?"selected":""}>${esc(x.nom)}</option>`).join("")}</select></div></div>
    <div class="row"><div class="field"><label for="f_beneficiaire">Nom du bénéficiaire</label><input id="f_beneficiaire" value="${esc(f.beneficiaire)}" placeholder="Nom et post-nom" required></div>
      <div class="field"><label for="f_adresse">Adresse complète</label><input id="f_adresse" value="${esc(f.adresse)}"></div></div>
    <div class="field"><label for="f_objet">Objet du paiement</label><textarea id="f_objet" rows="2">${esc(f.objet)}</textarea></div>
    <div class="field pick"><label for="f_q">Imputation budgétaire (canevas juin 2026)</label>
      <input id="f_q" placeholder="Code ou libellé, ex. 61136, 61 13 ou carburant" value="${esc(f.q)}">
      <select id="f_impId" size="6" aria-label="Imputation">${opts}</select>
      <small class="muted">${list.length} imputation(s)${list.length>400?" — affinez la recherche":""}</small>
      ${imp?(()=>{ const rs=rubsDe(imp.id).length? rubsDe(imp.id) : rubsDe(c.ctrl); return rs.length?`<small class="cle">Répartition : ${rs.map(r=>`<b>${esc(r.nom)}</b> (${esc(compteNom(r.compteBudget))}) — clés ${esc([...new Set(r.lignes.map(l=>l.cle).filter(Boolean))].slice(0,4).join(", "))}${r.lignes.length>4?"…":""}`).join(" · ")}</small>`:`<small class="muted">Aucune rubrique de répartition sur cette imputation : crédit direct uniquement.</small>`; })():""}</div>
    <div class="row"><div class="field" style="flex:2 1 180px"><label for="f_montant">Montant</label><input id="f_montant" class="num" inputmode="decimal" value="${esc(f.montant)}" required></div>
      <div class="field" style="flex:0 1 110px"><label for="f_devise">Devise</label><select id="f_devise">${Object.keys(DEVISES).map(d=>`<option ${d===f.devise?"selected":""}>${d}</option>`).join("")}</select></div>
      <div class="field" style="flex:1 1 150px"><label for="f_mode">Mode de paiement</label><select id="f_mode">${MODES.map(m=>`<option ${m===f.mode?"selected":""}>${m}</option>`).join("")}</select></div></div>
    ${parseNum(f.montant)>0?`<small class="muted">${esc(sommeLettres(parseNum(f.montant),f.devise))}${f.devise!=="CDF"?` · équivalent ${fc(c.eng)} au taux du jour (1 ${f.devise} = ${sp(nf.format(taux()[f.devise]))} FC)`:""}</small>`:""}
    <div class="row"><div class="field"><label for="f_statutPaiement">Statut</label><select id="f_statutPaiement">${STATUTS.filter(s=>s!=="Rejetée").map(s=>`<option ${s===f.statutPaiement?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label for="f_observation">Observation</label><input id="f_observation" value="${esc(f.observation)}" placeholder="RAS"></div></div>
    <label class="hb"><input type="checkbox" id="f_horsBudget" ${f.horsBudget?"checked":""}> Dépense imprévue, non prévue dans la loi du budget votée (suivie à part, sans toucher aux crédits)</label>
    ${over? (v.bloquer? `<div class="notice bad"><b>Crédit insuffisant.</b> Cette OP dépasse le disponible de l'imputation de ${fc(-c.dispo)}. Elle ne peut pas être enregistrée sans modification budgétaire.</div>`
       : `<div class="notice bad"><b>Dépassement de ${fc(-c.dispo)}.</b> <label><input type="checkbox" id="f_forcer" ${f.forcer?"checked":""} style="width:auto"> Enregistrer quand même (dépassement signalé)</label></div>`):""}
    ${cpt && c.eng>0 && !f.horsBudget ? `<small class="${sC<0?"neg":"muted"}">Compte ${esc(cpt.nom)} : solde après cette OP ${sC<0?"— dépassement de "+fc(-sC):fc(sC)}</small>`:""}

   </form>
   <div class="stack">${ficheEntete({...f,numero})}${ficheBC(imp,c,f.date,f.horsBudget)}${ficheFin(f)}</div>
  </div>`;
}

   <h2 class="optitle">ORDONNANCE DE PAIEMENT N° <span class="n">${esc(f.numero)||"……"}</span></h2>

   <p class="opsomme">Veuillez effectuer le paiement ci-dessous, s'élevant à la somme de (1) : <b>${m>0? esc(sommeLettres(m,f.devise))+" ("+fmtDev(m,f.devise)+")" : "……………………"}</b></p><div class="rule2"></div>
   <dl class="opdl"><dt>Nom du Bénéficiaire :</dt><dd>${esc(f.beneficiaire)||"……………………"}</dd><dt>Adresse complète :</dt><dd>${esc(f.adresse)||"……………………"}</dd><dt>Objet du paiement :</dt><dd>${esc(f.objet)||"……………………"}</dd>

function ficheBC(imp,c,date,hb){

   <h2>A. BUDGET - CONTRÔLE</h2><div class="rule2"></div><h3>A. Renseignements budgétaires</h3>
   ${hb&&imp?`<p class="muted" style="margin:0 0 8px">Dépense hors budget : l'engagement n'est pas imputé sur le crédit voté.</p>`:""}
   ${imp&&c.ctrl&&c.ctrl!==imp.id?`<p class="cle" style="margin:0 0 8px">Pas de crédit propre : contrôle sur la ligne mère ${esc(impById(c.ctrl)?.code)} — ${esc(impById(c.ctrl)?.libelle)}</p>`:""}

function ficheFin(f){ return `<section class="bc fin" aria-label="Finances"><h3 style="margin-top:0">B. Finances</h3>

/* --- Liste des OP --- */
function filtOps(){ const {q,imp,compte,du,au}=S.filt; const ql=q.trim().toLowerCase(); const ctl=controle();
  return {ctl, list: ctl.list.filter(o=>(!imp||o.impId===imp)&&(!compte||o.compte===compte)&&(!du||o.date>=du)&&(!au||o.date<=au)&&(!ql||[o.numero,o.beneficiaire,o.objet,o.service,impById(o.impId)?.code,valStatut(o),o.statutPaiement].join(" ").toLowerCase().includes(ql)))}; }
function vRegistre(){
  const {ctl,list}=filtOps(); const used=[...new Set(opsExercice().map(o=>o.impId))].map(impById).filter(Boolean).sort((a,b)=>a.code.localeCompare(b.code));
  const tot=list.filter(compte_dans_budget).reduce((s,o)=>s+cdf(o),0);
  return `<div class="spread"><div><h1>Liste des ordonnances de paiement</h1><p class="sub">Chaque ligne reprend les renseignements budgétaires de l'OP, recalculés dans l'ordre chronologique (montants en FC).</p></div>
   <div class="btns"><button data-act="xlsOps">Exporter (Excel)</button>${S.admin?`<button data-act="importOps">Importer des OP (Excel)</button>`:""}</div></div>
   <div class="card row">
    <div class="field"><label for="r_q">Recherche</label><input id="r_q" value="${esc(S.filt.q)}" placeholder="N°, bénéficiaire, service, statut…"></div>
    <div class="field"><label for="r_compte">Compte</label><select id="r_compte"><option value="">Tous</option>${comptesDe(S.rep).map(c=>`<option value="${c.id}" ${S.filt.compte===c.id?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></div>
    <div class="field"><label for="r_imp">Imputation</label><select id="r_imp"><option value="">Toutes</option>${used.map(i=>`<option value="${i.id}" ${S.filt.imp===i.id?"selected":""}>${esc(i.code)} — ${esc(i.libelle)}</option>`).join("")}</select></div>
    <div class="field" style="flex:0 1 160px"><label for="r_du">Du</label><input id="r_du" type="date" value="${S.filt.du}"></div>
    <div class="field" style="flex:0 1 160px"><label for="r_au">Au</label><input id="r_au" type="date" value="${S.filt.au}"></div></div>
   ${S.confirm?.type==="annuler"? `<div class="confirm">Annuler l'OP ${esc(S.ops.find(o=>o.id===S.confirm.id)?.numero)} ? Son montant sera libéré sur l'imputation ; le numéro ne sera jamais réutilisé. <button class="danger small" data-act="annulerOk">Confirmer l'annulation</button><button class="small" data-act="cancelConfirm">Garder</button></div>`:""}
   ${list.length? `<div class="tbl"><table><thead><tr><th>N° OP</th><th>Date</th><th>Bénéficiaire / objet</th><th>Imputation</th><th class="r">Montant</th><th class="r">Crédit initial</th><th class="r">Solde disponible</th><th class="r">Engagement cumulé</th><th class="r">Disponible à nouveau / dépassement</th><th>Validation</th><th></th></tr></thead><tbody>
   ${list.map(o=>{ const c=ctl.par.get(o.id); const i=impById(o.impId); const hc=c.horsCalcul;
     return `<tr class="${o.statut==="annule"?"annule":(!hc&&c.dispo<0)?"depasse":""}"><td class="n">${esc(o.numero)}</td><td class="n">${fdate(o.date)}</td><td>${esc(o.beneficiaire)}<br><small class="muted">${esc(o.objet)}${o.service?" · "+esc(o.service):""}</small>${o.horsBudget?`<br><span class="pill">Hors budget</span>`:""}</td>
     <td><b class="n">${esc(i?.code||"?")}</b><br><small class="muted">${esc(i?.libelle||"")}</small><br><small class="muted">${esc(compteNom(o.compte))}</small></td>
     <td class="r n">${fmtDev(o.montant,o.devise)}${o.devise&&o.devise!=="CDF"?`<br><small class="muted">${fc(cdf(o))}</small>`:""}</td>
     <td class="r n">${fc(c.ci)}</td><td class="r n">${fc(c.solde)}</td><td class="r n">${hc?"—":fc(c.cumul)}</td>
     <td class="r n dispo">${hc?"—":(c.dispo<0?"Dépassement "+fc(-c.dispo):fc(c.dispo))}</td>

     <td><div class="btns" style="flex-wrap:nowrap"><button class="small" data-act="pdfOp" data-id="${o.id}">Imprimer</button>${S.admin&&o.statut!=="annule"?`<button class="small danger" data-act="annuler" data-id="${o.id}">Annuler</button>`:""}</div></td></tr>`; }).join("")}
   <tr class="tot"><td colspan="4">Total imputé au budget (${list.filter(compte_dans_budget).length} OP)</td><td class="r n">${fc(tot)}</td><td colspan="6"></td></tr>
   </tbody></table></div>` : `<div class="card empty"><h2>Aucune OP ${opsExercice().length?"pour ces filtres":"enregistrée"}</h2><p class="muted">Les OP saisies dans <a href="#saisie">Nouvelle OP</a> apparaissent ici avec leurs renseignements budgétaires.</p></div>`}`;

/* --- Validation (saisie / validation séparées) --- */
function vValidation(){
  const ops=opsExercice().filter(o=>o.statut!=="annule"); const att=ops.filter(o=>valStatut(o)==="En attente").sort(cmpOp);
  const faites=ops.filter(o=>valStatut(o)!=="En attente").sort((a,b)=>(b.validation?.le||"").localeCompare(a.validation?.le||"")).slice(0,40);
  const ctl=controle();
  return `<div><h1>Validation des OP</h1><p class="sub">Contrôle interne : la personne qui a saisi une OP ne peut pas la valider elle-même. Une OP rejetée libère le crédit de son imputation.</p></div>
   ${S.admin?"":`<div class="notice info">Lecture seule : la validation est réservée à l'Administrateur du Budget ou au Directeur Général (niveau Éditeur).</div>`}
   <div class="card stack"><h2>${att.length} OP en attente</h2>
   ${att.length?`<div class="tbl"><table><thead><tr><th>N° OP</th><th>Date</th><th>Bénéficiaire</th><th>Imputation</th><th class="r">Montant</th><th class="r">Disponible après OP</th><th>Saisie par</th><th>Décision</th></tr></thead><tbody>
   ${att.map(o=>{ const c=ctl.par.get(o.id); const propre=S.mode==="shared" && o.auteur && o.auteur===S.uid; const i=impById(o.impId);
     return `<tr><td class="n">${esc(o.numero)}</td><td class="n">${fdate(o.date)}</td><td>${esc(o.beneficiaire)}<br><small class="muted">${esc(o.objet)}</small></td><td class="n">${esc(i?.code||"")}</td><td class="r n">${fmtDev(o.montant,o.devise)}</td>
     <td class="r n ${!c.horsCalcul&&c.dispo<0?"neg":""}">${c.horsCalcul?"Hors budget":c.dispo<0?"Dépassement "+fc(-c.dispo):fc(c.dispo)}</td><td>${esc(nom(o.auteur))}</td>
     <td>${!S.admin?"—":propre?`<small class="muted">Votre propre saisie : un autre validateur doit décider.</small>`:
       `<div class="stack" style="gap:6px"><input id="vc_${o.id}" placeholder="Commentaire (obligatoire pour rejeter)" style="min-width:180px"><div class="btns" style="flex-wrap:nowrap"><button class="small primary" data-act="valider" data-id="${o.id}">Valider</button><button class="small danger" data-act="rejeter" data-id="${o.id}">Rejeter</button></div></div>`}</td></tr>`; }).join("")}
   </tbody></table></div>`:`<p class="muted">Aucune OP en attente de validation.</p>`}</div>
   <div class="card stack"><h2>Historique des décisions</h2>
   ${faites.length?`<div class="tbl"><table><thead><tr><th>N° OP</th><th>Décision</th><th>Par</th><th>Le</th><th>Commentaire</th></tr></thead><tbody>${faites.map(o=>`<tr><td class="n">${esc(o.numero)}</td><td>${badgeVal(o)}</td><td>${esc(nom(o.validation?.par))}</td><td class="n">${o.validation?.le?new Date(o.validation.le).toLocaleString("fr-FR"):""}</td><td>${esc(o.validation?.commentaire||"")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Aucune décision pour l'instant.</p>`}</div>`;
}

/* --- Suivi budgétaire --- */
function vSituation(){
  const v=vote(); const ctl=controle(); const cum=ctl.cum; const prev=creditsPrevus(S.rep);
  const credit = id => v ? (v.credits[id]||0) : prev[id]||0;
  const groups=S.plan.groupes||{}; const by={};
  for(const i of imps()){ const ci=credit(i.id), e=cum[i.id]||0; if(!S.sitAll && !ci && !e) continue; (by[i.compte] ||= []).push({i,ci,e}); }
  let T={ci:0,e:0}; let body="";
  for(const k of Object.keys(by).sort()){ const rows=by[k]; const g={ci:0,e:0}; rows.forEach(x=>{g.ci+=x.ci;g.e+=x.e;});
    T.ci+=g.ci; T.e+=g.e;
    body+=`<tr class="grp"><td class="n">${k}</td><td>${esc(groups[k]||"")}</td><td class="r n">${fc(g.ci)}</td><td class="r n">${fc(g.e)}</td><td class="r n">${fc(g.ci-g.e)}</td><td class="n">${pct(g.ci?g.e/g.ci:0)}</td></tr>`;
    body+=rows.map(x=>{ const d=x.ci-x.e, t=x.ci?x.e/x.ci:(x.e?2:0); return `<tr class="${d<0?"depasse":""}"><td class="n">${esc(x.i.code)}</td><td>${esc(x.i.libelle)}</td><td class="r n">${fc(x.ci)}</td><td class="r n">${fc(x.e)}</td><td class="r n dispo">${d<0?"Dépassement "+fc(-d):fc(d)}</td><td style="min-width:110px"><div class="bar"><i class="${t>1?"over":t>.85?"hot":""}" style="width:${Math.min(100,t*100)}%"></i></div><small class="n">${pct(t)}</small></td></tr>`; }).join(""); }
  const cs=comptesDe(S.rep); const cid=S.chaine||cs[0]?.id; const cpt=cs.find(c=>c.id===cid);
  let solde=compteVote(cid); const chaine=ctl.list.filter(o=>o.compte===cid&&compte_dans_budget(o)).map(o=>{ solde-=cdf(o); return `<tr><td class="n">${esc(o.numero)}</td><td class="n">${fdate(o.date)}</td><td>${esc(o.beneficiaire)}</td><td class="r n">${fmtDev(o.montant,o.devise)}</td><td class="r n">${fc(cdf(o))}</td><td class="r n ${solde<0?"neg":""}">${fc(solde)}</td></tr>`; }).join("");
  const hb=opsExercice().filter(o=>o.horsBudget&&o.statut!=="annule"&&valStatut(o)!=="Rejetée"); const hbT=hb.reduce((s,o)=>s+cdf(o),0);
  return `<div class="spread"><div><h1>Suivi budgétaire</h1><p class="sub">${v?`Crédits votés (v${v.version}, ${fdate(v.date)})`:"Budget non voté : crédits prévus par la répartition"} face aux engagements cumulés, en FC.</p></div>
   <div class="btns"><button data-act="xlsSit">Exporter (Excel)</button></div></div>
   <h2>Comptes budgétaires</h2>${comptesCartes(ctl)}
   <div class="card stack"><div class="spread"><h2>Chaîne de dépense par compte</h2><div class="field" style="flex:0 1 320px"><label for="c_chaine">Compte</label><select id="c_chaine">${cs.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></div></div>
    <p class="muted" style="margin:0">Solde de départ : ${fc(compteVote(cid))}${cpt?.note?` · ${esc(cpt.note)}`:""}</p>
    ${chaine?`<div class="tbl"><table><thead><tr><th>N° OP</th><th>Date</th><th>Bénéficiaire</th><th class="r">Montant</th><th class="r">Équiv. FC</th><th class="r">Solde restant</th></tr></thead><tbody>${chaine}</tbody></table></div>`:`<p class="muted">Aucune dépense sur ce compte pour l'instant.</p>`}</div>
   <div class="spread"><h2>Par imputation</h2><label class="chip" style="color:var(--ink)"><input type="checkbox" id="s_all" ${S.sitAll?"checked":""} style="width:auto"> Toutes les imputations</label></div>
   <div class="tbl"><table><thead><tr><th>Imputation</th><th>Libellé</th><th class="r">Crédit initial</th><th class="r">Engagement cumulé</th><th class="r">Disponible / dépassement</th><th>Exécution</th></tr></thead>
   <tbody>${body}<tr class="tot"><td colspan="2">TOTAL GÉNÉRAL</td><td class="r n">${fc(T.ci)}</td><td class="r n">${fc(T.e)}</td><td class="r n">${fc(T.ci-T.e)}</td><td class="n">${pct(T.ci?T.e/T.ci:0)}</td></tr></tbody></table></div>

document.addEventListener("input", e=>{ const t=e.target; if(!t.id) return;
  if(t.id.startsWith("f_") && S.form){ const k=t.id.slice(2); if(k==="num") return; S.form[k]= t.type==="checkbox"? t.checked : t.value;
    if(k==="q"){ const q=t.value.trim().toLowerCase(), qn=nospace(q); const ids=imps().filter(i=>!q||nospace(i.code).includes(qn)||i.libelle.toLowerCase().includes(q)); if(ids.length===1) S.form.impId=ids[0].id; else { const ex=imps().find(i=>nospace(i.code)===qn); if(ex) S.form.impId=ex.id; } }
    if(k==="compte") S.form.compteManuel=true;
    if((k==="impId"||k==="q") && !S.form.compteManuel){ const rb=rubsDe(S.form.impId)[0]||rubsDe(ctrlId(S.form.impId))[0]; if(rb?.compteBudget) S.form.compte=rb.compteBudget; }
    if(t.tagName==="INPUT"&&t.type!=="checkbox"&&k!=="q"&&k!=="montant") deferRender(); else render(); return; }
  if(t.id.startsWith("r_")){ S.filt[t.id.slice(2)]=t.value; render(); return; }
  if(t.id.startsWith("p_") && S.draft){ const k=t.id.slice(2); S.draft.params[k]= k==="exercice"? t.value : parseNum(t.value); S.dirty=true; deferRender(); return; }
  if(t.id.startsWith("t_")){ S.tauxDraft={...(S.tauxDraft||taux()),[t.id.slice(2)]:parseNum(t.value)}; return; }
  if(t.dataset.rn!==undefined){ S.draft.rubriques[+t.dataset.rn].nom=t.value; S.dirty=true; deferRender(); return; }
  if(t.dataset.cm!==undefined){ S.draft.comptes[+t.dataset.cm].montant=parseNum(t.value); S.dirty=true; deferRender(); return; }
  if(t.dataset.cp){ const [ci,pi,k]=t.dataset.cp.split(","); S.draft.comptes[+ci].postes[+pi][k]= k==="label"? t.value : parseNum(t.value); S.dirty=true; deferRender(); return; }
  if(t.dataset.l){ const [ri,li,k]=t.dataset.l.split(","); const l=S.draft.rubriques[+ri].lignes[+li];
    if(k==="usd") l.usd=!!t.value; else if(k==="eff"){ if(t.value) l.eff=t.value; else { l.effectif=effVal(l); delete l.eff; } }
    else l[k]= (k==="libelle"||k==="cle")? t.value : parseNum(t.value);
    S.dirty=true; deferRender(); return; }
});
let dr; function deferRender(){ clearTimeout(dr); dr=setTimeout(render,250); }
document.addEventListener("change", async e=>{ const t=e.target;
  if(t.id==="s_all"){ S.sitAll=t.checked; render(); }
  if(t.id==="c_chaine"){ S.chaine=t.value; render(); }
  if(t.dataset.ri!==undefined && t.tagName==="SELECT"){ const r=S.draft.rubriques[+t.dataset.ri]; r.imputation=t.value||null; delete r.propose; S.dirty=true; render(); }
  if(t.dataset.rc!==undefined){ S.draft.rubriques[+t.dataset.rc].compteBudget=t.value; S.dirty=true; render(); }
  if(t.id==="v_bloquer"){ const base=S.vote||{statut:"brouillon"}; try{ await writeDoc("budget/vote",{...base,bloquer:t.checked}); toast(t.checked?"Les dépassements seront bloqués.":"Les dépassements seront autorisés avec signalement."); }catch(err){ toast(dbError(err)); } }
  if(t.dataset.direct){ const i=S.plan.imputations.find(x=>x.id===t.dataset.direct); const nv=parseNum(t.value); if(i && nv!==parseNum(i.direct)){ const plan=clone(S.plan); plan.imputations.find(x=>x.id===i.id).direct=nv; try{ await writeDoc("budget/plan",plan); toast("Crédit direct enregistré."); }catch(err){ toast(dbError(err)); } } }
});

document.addEventListener("submit", async e=>{ if(e.target.id!=="opForm") return; e.preventDefault(); await enregistrerOp(); });
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;

async function enregistrerOp(){ const f=S.form, v=vote(); if(!v||S.saving) return; const c=calcNouveau(f); const imp=impById(f.impId);
  if(!imp||!(c.eng>0)||!f.beneficiaire.trim()) return toast("Complétez le bénéficiaire, l'imputation et le montant.");
  if(!f.horsBudget && c.dispo<0 && (v.bloquer||!f.forcer)) return toast("Crédit insuffisant sur cette imputation.");
  S.saving=true; render();
  try{ const {numero,seq}=await reserverNumero(f.date); const {m,y}=cleMois(f.date);
    const op={id:`OP-${String(seq).padStart(3,"0")}-${m}-${y}`,numero,date:f.date,service:f.service,compte:f.compte,beneficiaire:f.beneficiaire.trim(),adresse:(f.adresse||"").trim(),objet:f.objet.trim(),
      impId:imp.id,impCode:imp.code,montant:parseNum(f.montant),devise:f.devise,taux:f.devise==="CDF"?1:taux()[f.devise],montantCDF:Math.round(c.eng*100)/100,
      mode:f.mode,statutPaiement:f.statutPaiement,observation:f.observation.trim(),horsBudget:!!f.horsBudget,
      statut:"valide",validation:{statut:"En attente"},exercice:v.exercice,voteVersion:v.version,createdAt:new Date().toISOString(),auteur:S.uid||null,depassement:!f.horsBudget&&c.dispo<0,bc:c,impressions:0};
    await saveOp(op);
    toast(`Ordonnance ${numero} enregistrée, en attente de validation. Disponible à nouveau : ${fc(c.dispo)}`);
    S.form=blankForm();
  }catch(err){ toast(dbError(err)); }
  S.saving=false; render(); }

  async pdfOp(b){ const o=S.ops.find(x=>x.id===b.dataset.id); const dup=(o.impressions||0)>0; pdfFiche(o, controle().par.get(o.id), false, dup);
    try{ await saveOp({...o,impressions:(o.impressions||0)+1}); }catch{} },
  annuler(b){ S.confirm={type:"annuler",id:b.dataset.id}; render(); },
  async annulerOk(){ const o=S.ops.find(x=>x.id===S.confirm.id); S.confirm=null; if(!o) return render();
    await saveOp({...o,statut:"annule",annuleLe:new Date().toISOString(),annulePar:S.uid||null}); toast(`OP ${o.numero} annulée.`); render(); },
  async valider(b){ await decider(b.dataset.id,"Validée"); },
  async rejeter(b){ await decider(b.dataset.id,"Rejetée"); },
  cancelConfirm(){ S.confirm=null; render(); },
  async saveTaux(){ const t=S.tauxDraft||taux(); if(!(t.USD>0)||!(t.EUR>0)) return toast("Saisissez des taux positifs."); await writeDoc("budget/taux",{USD:t.USD,EUR:t.EUR,date:today()}); S.tauxDraft=null; toast(`Taux du jour enregistrés : 1 USD = ${t.USD} FC, 1 EUR = ${t.EUR} FC.`); },
  addRub(){ const id="r"+uid(); S.draft.rubriques.unshift({id,nom:"NOUVELLE RUBRIQUE",imputation:null,compteBudget:"fonctionnement",lignes:[{libelle:"",effectif:0,taux:0,base:0,cle:""}]}); S.openRub.add(id); S.dirty=true; render(); },
  addLigne(b){ S.draft.rubriques[+b.dataset.ri].lignes.push({libelle:"",effectif:0,taux:0,base:0,cle:""}); S.dirty=true; render(); },
  delLigne(b){ S.draft.rubriques[+b.dataset.ri].lignes.splice(+b.dataset.li,1); S.dirty=true; render(); },
  addPoste(b){ const c=S.draft.comptes[+b.dataset.ci]; if(!c.postes||!c.postes.length) c.postes=[{label:"Montant global",montant:parseNum(c.montant)}]; c.postes.push({label:"Nouveau poste",montant:0}); S.dirty=true; render(); },
  delPoste(b){ const c=S.draft.comptes[+b.dataset.ci]; const p=c.postes.splice(+b.dataset.pi,1)[0]; if(!c.postes.length) c.montant=parseNum(p?.montant); S.dirty=true; render(); },
  delRub(b){ S.confirm={type:"delRub",ri:+b.dataset.ri}; render(); },
  delRubOk(){ S.draft.rubriques.splice(S.confirm.ri,1); S.confirm=null; S.dirty=true; render(); },
  async saveRep(){ await writeDoc("budget/repartition",S.draft); S.dirty=false; toast("Répartition enregistrée."); render(); },
  discardRep(){ S.draft=null; S.dirty=false; render(); },
  vote(){ S.confirm={type:"vote"}; render(); },
  async voteOk(){ S.confirm=null; const R=S.rep; const credits=creditsPrevus(R); for(const k in credits) credits[k]=Math.round(credits[k]);
    const comptes={}; for(const c of comptesDe(R)) comptes[c.id]=Math.round(compteMontant(c));
    const old=S.vote||{}; const version=(old.statut==="vote"?old.version:0)+1; const total=creditsTotal(credits);
    const hist=[...(old.historique||[])]; if(old.statut==="vote") hist.push({version:old.version,date:old.date,total:creditsTotal(old.credits||{})});
    await writeDoc("budget/vote",{statut:"vote",version,exercice:R.params.exercice,date:today(),voteLe:new Date().toISOString(),votePar:S.uid||null,credits,comptes,bloquer:old.bloquer ?? true,historique:hist});
    toast(`Budget ${R.params.exercice} voté (v${version}) : ${fc(total)}.`); render(); },
  async addImp(){ const code=$("#n_code").value.trim().replace(/\s+/g," "), lib=$("#n_lib").value.trim(); if(!/^[67]\d/.test(code)||!lib) return toast("Saisissez un code de classe 6 ou 7 (ex. 64 90 15) et un libellé.");
    const plan=clone(S.plan); plan.imputations.push({id:"i"+uid(),code,libelle:lib,compte:code.slice(0,2),direct:0});
    plan.imputations.sort((a,b)=>a.code.localeCompare(b.code,"fr",{numeric:true})); await writeDoc("budget/plan",plan); toast("Imputation "+code+" ajoutée."); },
  xlsOps(){ const {ctl,list}=filtOps(); const rows=list.map(o=>{ const c=ctl.par.get(o.id); const i=impById(o.impId);
      return {"N° OP":o.numero,"Date":fdate(o.date),"Service":o.service||"","Compte budgétaire":compteNom(o.compte),"Bénéficiaire":o.beneficiaire,"Adresse":o.adresse||"","Objet":o.objet,"Imputation":i?.code,"Libellé imputation":i?.libelle,"Montant":o.montant,"Devise":o.devise||"CDF","Équiv. FC":cdf(o),"Crédit initial":c.ci,"Engagement":c.eng,"Solde disponible":c.solde,"Engagement cumulé":c.horsCalcul?"":c.cumul,"Disponible à nouveau / Dépassement":c.horsCalcul?"":c.dispo,"Hors budget":o.horsBudget?"Oui":"","Validation":o.statut==="annule"?"Annulée":valStatut(o),"Mode":o.mode||"","Statut":o.statutPaiement||"","Observation":o.observation||""}; });
    xls([["Liste des OP",rows]],`Liste_OP_${vote()?.exercice||""}.xlsx`); },
  xlsSit(){ const v=vote(); const ctl=controle(); const prev=creditsPrevus(S.rep);
    const rows=imps().map(i=>{ const ci=v?(v.credits[i.id]||0):prev[i.id]||0; const e=ctl.cum[i.id]||0; return {"Imputation":i.code,"Libellé":i.libelle,"Crédit initial":ci,"Engagement cumulé":e,"Disponible / Dépassement":ci-e,"Taux d'exécution":ci?+(e/ci).toFixed(4):""}; }).filter(r=>S.sitAll||r["Crédit initial"]||r["Engagement cumulé"]);
    const cpt=comptesDe(S.rep).map(c=>({"Compte":c.nom,"Montant voté":compteVote(c.id),"Engagé":ctl.cumC[c.id]||0,"Solde":compteVote(c.id)-(ctl.cumC[c.id]||0),"Mensuel (÷12)":c.statut==="aligne"?"":Math.round(compteVote(c.id)/12)}));
    xls([["Par imputation",rows],["Comptes budgétaires",cpt]],`Suivi_budgetaire_${v?.exercice||params().exercice}.xlsx`); },
  xlsRep(){ const R=S.draft||S.rep, p=R.params; const rows=[]; const sum=[];
    for(const r of R.rubriques){ const i=impById(r.imputation); sum.push({"Rubrique":r.nom,"Imputation":i?.code||"À affecter","Libellé imputation":i?.libelle||"","Montant":Math.round(rubTotal(r,p))});
      for(const l of r.lignes) rows.push({"Rubrique":r.nom,"Libellé":l.libelle,"Effectif":effVal(l,p),"Taux":l.taux,"Base (FC)":l.usd?p.tauxChange:l.base,"Montant":Math.round(ligneMontant(l,p)),"Clé":l.cle,"Imputation":i?.code||""}); }
    const cp=[]; for(const c of comptesDe(R)){ if(c.postes?.length) c.postes.forEach(x=>cp.push({"Compte":c.nom,"Poste":x.label,"Montant annuel":x.montant,"Mensuel":Math.round(parseNum(x.montant)/12)})); else cp.push({"Compte":c.nom,"Poste":"(global)","Montant annuel":c.montant,"Mensuel":Math.round(parseNum(c.montant)/12)}); }
    xls([["Synthèse",sum],["Ventilation",rows],["Comptes budgétaires",cp]],`Repartition_budget_${p.exercice}.xlsx`); },
  importRep(){ pickFile(importVentilation); },
  importOps(){ if(!vote()) return toast("Votez d'abord le budget."); pickFile(importOpsFile); },
};
async function decider(id,statut){ const o=S.ops.find(x=>x.id===id); if(!o) return; const com=(document.getElementById("vc_"+id)?.value||"").trim();
  if(S.mode==="shared" && o.auteur && o.auteur===S.uid) return toast("Vous ne pouvez pas valider une OP que vous avez saisie.");
  if(statut==="Rejetée" && !com) return toast("Indiquez le motif du rejet dans le commentaire.");
  await saveOp({...o,validation:{statut,par:S.uid||null,le:new Date().toISOString(),commentaire:com},statutPaiement:statut==="Rejetée"?"Rejetée":(o.statutPaiement==="En attente"?"Validée":o.statutPaiement)});
  toast(`OP ${o.numero} ${statut==="Validée"?"validée":"rejetée"}.`); }

/* ---------- Excel ---------- */
function xls(sheets,name){ if(!window.XLSX) return toast("Le module Excel n'a pas pu se charger.");
  const wb=XLSX.utils.book_new(); for(const [n,rows] of sheets){ const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"":"Aucune donnée"}]); ws["!cols"]=Object.keys(rows[0]||{}).map(k=>({wch:Math.max(12,Math.min(50,k.length+4))})); XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31)); }
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"}); saveFile(name,new Blob([out])); }
function pickFile(cb){ const fi=$("#fileIn"); fi.value=""; fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ cb(XLSX.read(rd.result,{type:"array"})); }catch(err){ console.error(err); toast("Fichier illisible : "+err.message); } }; rd.readAsArrayBuffer(f); }; fi.click(); }
/* Feuille au format « ventillation » : ligne de titre = rubrique ; ligne avec effectif, taux, base numériques = ligne de répartition */
function importVentilation(wb){ const name=wb.SheetNames.find(n=>/ventil/i.test(n))||wb.SheetNames[0]; const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const isN=v=>typeof v==="number"; const rubs=[]; let cur=null; const P=S.draft.params; const tc=parseNum(P.tauxChange);
  const effMap={[P.REC]:"REC",[P.MON]:"MON",[effVal({eff:"TOT"},P)]:"TOT",[effVal({eff:"RM"},P)]:"RM"};
  for(const r of rows){ const [a,b,c,d,e,f]=r;
    if(a!=null && String(a).trim() && b==null && c==null && e==null){ cur={id:"r"+uid(),nom:String(a).trim().replace(/\s+/g," "),imputation:null,compteBudget:"fonctionnement",lignes:[]}; rubs.push(cur); continue; }
    if(isN(b)&&isN(c)&&isN(d)){ if(!cur){ cur={id:"r"+uid(),nom:"SANS TITRE",imputation:null,lignes:[]}; rubs.push(cur); }
      const l={libelle:String(a??f??"").replace(/^\*\s*/,"").trim(),effectif:b,taux:c,base:d,cle:f?String(f).trim():""}; if(effMap[b]) l.eff=effMap[b]; if(d===tc) l.usd=true; cur.lignes.push(l); } }
  const kept=rubs.filter(r=>r.lignes.length); if(!kept.length) return toast("Aucune ligne de ventilation reconnue dans « "+name+" ».");
  const old=new Map(S.draft.rubriques.map(r=>[r.nom.toUpperCase(),r])); kept.forEach(r=>{ const o=old.get(r.nom.toUpperCase()); if(o){ r.imputation=o.imputation||null; r.compteBudget=o.compteBudget||"fonctionnement"; } });
  S.draft.rubriques=kept; S.draft.params.source="Importé de « "+name+" »"; S.dirty=true; render(); toast(`${kept.length} rubriques importées. Vérifiez les imputations puis enregistrez.`); }
/* Import d'OP : colonnes N°, Date, Bénéficiaire, Adresse, Objet, Imputation (code), Montant, Devise, Service, Compte */
async function importOpsFile(wb){ const v=vote(); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:false,defval:""});
  const key=(o,re)=>{ const k=Object.keys(o).find(k=>re.test(k.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase())); return k? o[k] : ""; };
  let ok=0, ko=0;
  for(const r of rows){ const code=nospace(key(r,/imput/)); const imp=imps().find(i=>nospace(i.code)===code); const m=parseNum(key(r,/montant|engagement/));
    let d=String(key(r,/date/)).trim(); if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(d)){ let [j,mo,y]=d.split("/"); if(y.length===2) y="20"+y; d=`${y}-${mo.padStart(2,"0")}-${j.padStart(2,"0")}`; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=today();
    if(!imp||!(m>0)){ ko++; continue; }
    const dev=["USD","EUR"].includes(String(key(r,/devise/)).toUpperCase())? String(key(r,/devise/)).toUpperCase() : "CDF";
    const cptTxt=String(key(r,/compte/)).toLowerCase(); const cpt=comptesDe(S.rep).find(c=>cptTxt && (c.nom.toLowerCase().includes(cptTxt)||c.id===cptTxt))?.id || comptesDe(S.rep)[0]?.id;
    let numero=String(key(r,/^n|numero/)).trim(); let id;
    if(!numero){ const res=await reserverNumero(d); numero=res.numero; } id="imp-"+uid();
    await saveOp({id,numero,date:d,service:String(key(r,/service|section/)).trim(),compte:cpt,beneficiaire:String(key(r,/benef/)).trim(),adresse:String(key(r,/adresse/)).trim(),objet:String(key(r,/objet|libelle/)).trim(),impId:imp.id,impCode:imp.code,
      montant:m,devise:dev,taux:dev==="CDF"?1:taux()[dev],montantCDF:versCDF(m,dev),mode:"",statutPaiement:"Payée",observation:"Importée",horsBudget:false,statut:"valide",validation:{statut:"Validée",par:S.uid||null,le:new Date().toISOString(),commentaire:"Import de l'historique"},
      exercice:v.exercice,voteVersion:v.version,createdAt:new Date().toISOString(),auteur:S.uid||null,importe:true,impressions:0}); ok++; }
  toast(`${ok} OP importée(s)${ko?`, ${ko} ignorée(s) (imputation inconnue ou montant nul)`:""}.`); }

/* ---------- Ordonnance PDF ---------- */
function pdfFiche(o,c,apercu,duplicata){ if(!window.jspdf) return toast("Le module PDF n'a pas pu se charger."); const imp=impById(o.impId); if(!imp) return;
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:"mm",format:"a4"}); const L=16, W=178, C=L+W/2; let y=14;
  const money=v=>sp(nf.format(Math.round(v)))+" FC";
  if(duplicata){ try{ d.setGState(new d.GState({opacity:0.18})); }catch{} d.setTextColor(200,40,40); d.setFont("helvetica","bold"); d.setFontSize(60); d.text("DUPLICATA",C,175,{align:"center",angle:30}); d.setTextColor(0); try{ d.setGState(new d.GState({opacity:1})); }catch{} }
  d.setFont("helvetica","normal"); d.setFontSize(7); d.setTextColor(110); d.text(`Copie imprimée le ${new Date().toLocaleString("fr-FR")}${S.me?.name?" par "+S.me.name:""}`,L+W,8,{align:"right"}); d.setTextColor(0);
  try{ d.addImage(LOGO,"JPEG",L,y-2,24,24); }catch{}
  d.setFont("helvetica","bold"); d.setFontSize(10); d.text("ENSEIGNEMENT SUPÉRIEUR ET UNIVERSITAIRE",C+8,y+2,{align:"center"});
  d.setFontSize(12); d.text("INSTITUT SUPÉRIEUR DES TECHNIQUES MÉDICALES",C+8,y+8,{align:"center"});
  d.setFontSize(10); d.setTextColor(110); d.text("I.S.T.M. / KINSHASA",C+8,y+13,{align:"center"}); d.setTextColor(0);
  d.text("ADMINISTRATION DU BUDGET",C+8,y+18,{align:"center"}); d.text("DIRECTION DES FINANCES",C+8,y+23,{align:"center"}); d.setLineWidth(.3); d.line(C-14,y+24,C+30,y+24); y+=33;
  d.setFontSize(15); d.text(`ORDONNANCE DE PAIEMENT N° ${o.numero||"……"}`,C,y,{align:"center"}); y+=5;
  const vs=o.statut==="annule"?"ANNULÉE":valStatut(o); d.setFontSize(9);
  if(vs==="Validée"){ d.setTextColor(29,122,74); d.text(`VALIDÉE${o.validation?.le?" le "+new Date(o.validation.le).toLocaleDateString("fr-FR"):""}`,C,y,{align:"center"}); }
  else if(vs==="Rejetée"||vs==="ANNULÉE"){ d.setTextColor(179,38,30); d.text(vs.toUpperCase(),C,y,{align:"center"}); }
  else { d.setTextColor(168,101,18); d.text(apercu?"APERÇU — NON ENREGISTRÉE":"EN ATTENTE DE VALIDATION",C,y,{align:"center"}); }
  d.setTextColor(0); y+=4;
  if(o.horsBudget){ d.setTextColor(179,38,30); d.text("DÉPENSE HORS BUDGET VOTÉ — NON PRÉVUE DANS LA LOI DU BUDGET",C,y,{align:"center"}); d.setTextColor(0); y+=4; }
  d.setLineWidth(.8); d.line(L,y,L+W,y); y+=5;
  d.setFontSize(10); d.setFont("helvetica","bold"); const som=d.splitTextToSize(`Veuillez effectuer le paiement ci-dessous, s'élevant à la somme de (1) : ${sommeLettres(o.montant,o.devise)} (${fmtDev(o.montant,o.devise)})`,W); d.text(som,L,y); y+=4.6*som.length; d.setLineWidth(.4); d.line(L,y-1.5,L+W,y-1.5); y+=4;
  const line=(k,v)=>{ d.setFont("helvetica","bold"); d.text(k,L,y); d.setFont("helvetica","normal"); const t=d.splitTextToSize(String(v||""),W-46); d.text(t.length?t:[""],L+46,y); d.setLineDashPattern([.5,1],0); d.line(L+45,y+1.2,L+W,y+1.2); d.setLineDashPattern([],0); y+=5.6*Math.max(1,t.length); };
  line("Nom du Bénéficiaire :",o.beneficiaire); line("Adresse complète :",o.adresse); line("Objet du paiement :",o.objet);
  line("Service / Date :",`${o.service||"—"}   ·   ${fdate(o.date)}`); line("Compte budgétaire :",compteNom(o.compte));
  if(o.devise&&o.devise!=="CDF") line("Équivalent :",`${money(cdf(o))} (1 ${o.devise} = ${sp(nf.format(o.taux||taux()[o.devise]))} FC)`);
  y+=2; d.setLineWidth(1); d.line(L,y,L+W,y); d.setLineWidth(.3); d.line(L,y+1.3,L+W,y+1.3); y+=8;
  const colW=W*0.6; d.setFont("helvetica","bold"); d.setFontSize(13); d.text("A. BUDGET - CONTRÔLE",L,y); d.text("B. FINANCES",L+colW+6,y); y+=2; d.line(L,y,L+colW,y); d.line(L+colW+6,y,L+W,y); y+=6;
  d.setFontSize(11); d.text("A. Renseignements budgétaires",L,y); const yF=y; y+=4;
  const bx=L+44, bw=colW-44, rh=8.5; const over=!o.horsBudget && c.dispo<0;
  const pc=c.ctrl&&c.ctrl!==imp.id? impById(c.ctrl) : null;
  const rows=[["Imputation",`${imp.code} — ${imp.libelle}${pc?` (crédit porté par ${pc.code})`:""}`],["Crédit initial",money(c.ci)],["Engagement",money(c.eng)],["Solde disponible",money(c.solde)],["Engagement cumulé",money(c.cumul)],[over?"Dépassement":"Disponible à nouveau",money(Math.abs(c.dispo))]];
  d.setLineWidth(.5); rows.forEach(([k,v],i)=>{ d.setFont("helvetica","bold"); d.setFontSize(10); d.text(k,L,y+5.6); d.rect(bx,y,bw,rh);
    if(i===0){ d.setFont("helvetica","normal"); d.setFontSize(7.5); d.text(d.splitTextToSize(v,bw-3).slice(0,2),bx+1.5,y+3.4); }
    else { d.setFont("courier","bold"); d.setFontSize(10.5); if(i===5&&over) d.setTextColor(179,38,30); d.text(v,bx+bw-1.5,y+5.6,{align:"right"}); d.setTextColor(0); }
    y+=rh; });
  if(o.horsBudget){ y+=4; d.setFont("helvetica","italic"); d.setFontSize(8); d.text("Hors budget : engagement non imputé sur le crédit voté.",L,y); }
  let yb=yF+1; const fin=[["Mode de paiement",o.mode],["Statut",o.statutPaiement],["Observation",o.observation||"RAS"]];
  fin.forEach(([k,v])=>{ d.setFont("helvetica","bold"); d.setFontSize(9); d.text(k,L+colW+6,yb); d.setFont("helvetica","normal"); const t=d.splitTextToSize(String(v||"—"),W-colW-6); d.text(t,L+colW+6,yb+4.5); yb+=6+4.5*t.length; });
  y=Math.max(y,yb)+10; d.setFont("helvetica","bold"); d.setFontSize(10); d.text(`Kinshasa, le ${o.date?fdate(o.date):"………………………"}`,L,y); y+=5;
  const sg=["Responsable Budget-Contrôle","Responsable Finances","Administrateur du Budget","Directeur Général"]; const sw=W/4;
  d.setFontSize(8.5); sg.forEach((s,i)=>{ d.text(d.splitTextToSize(s,sw-4),L+i*sw+sw/2,y,{align:"center"}); d.setLineWidth(.2); d.line(L+i*sw+4,y+22,L+(i+1)*sw-4,y+22); }); y+=30;
  d.setFont("helvetica","normal"); d.setFontSize(9); d.text("Pour acquit — Kinshasa, le ......................................",L,y); d.text("Nom, Post-nom et Signature : ................................",L+W,y,{align:"right"});
  d.setFontSize(7); d.setTextColor(120); d.text(`Budget voté v${vote()?.version||"?"} — exercice ${vote()?.exercice||""}`,L,289); d.setTextColor(0);
  saveFile(`Ordonnance_${String(o.numero||"brouillon").replace(/[^\w-]+/g,"_")}.pdf`, d.output("blob")); }

boot();
